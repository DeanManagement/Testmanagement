<div class="step-spec-grid">
  <div class="spec-tile">
    <span class="spec-label">{{ 'testCase.form.action' | translate }}</span>
    <div class="spec-text tm-markdown" [innerHTML]="action | markdown"></div>
  </div>
  <div class="spec-tile">
    <span class="spec-label">{{ 'stepResult.expected' | translate }}</span>
    <div class="spec-text tm-markdown" [innerHTML]="expectedResult | markdown"></div>
  </div>
  <!-- PRD-052: a tile only for what exists; alone, it spans the card instead of leaving a gap. -->
  @if (testData) {
    <div class="spec-tile" [class.spec-tile--wide]="!imageUrl" data-test-id="step-spec-test-data">
      <span class="spec-label">{{ 'testCase.form.testData' | translate }}</span>
      <div class="spec-text tm-markdown" [innerHTML]="testData | markdown"></div>
    </div>
  }
  @if (imageUrl) {
    <div class="spec-tile spec-tile--image" [class.spec-tile--wide]="!testData" data-test-id="step-spec-image">
      <img [src]="imageUrl | authImage" alt="Reference image" class="ref-image-thumb" loading="lazy" [appEnlarge]="imageUrl" />
    </div>
  }
</div>
