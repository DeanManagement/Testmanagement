@if (entries.length === 0 && !loading) {
  <p class="history-empty">{{ 'history.empty' | translate }}</p>
}

@if (entries.length > 0) {
  <div class="history-list">
    @for (entry of entries; track entry.id) {
      <app-activity-entry class="history-item" [entry]="entry" [projectId]="projectId" [currentEntityId]="entityId" />
    }
  </div>
}

@if (loading) {
  <div class="spinner-container">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
}

@if (hasMore && !loading && entries.length > 0) {
  <div class="load-more">
    <button mat-stroked-button (click)="loadMore()">
      {{ 'history.loadMore' | translate }}
    </button>
  </div>
}
