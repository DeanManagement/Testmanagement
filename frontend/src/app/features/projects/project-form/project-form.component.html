<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title data-test-id="project-form-title">
        {{ (editMode ? 'project.form.editTitle' : 'project.form.createTitle') | translate }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (editMode && projectKey) {
        <p class="project-key-display" data-test-id="project-key-display">
          <strong>{{ 'project.form.key' | translate }}:</strong> {{ projectKey }}
        </p>
      }
      <form [formGroup]="form" (ngSubmit)="onSubmit()" data-test-id="project-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'project.form.name' | translate }}</mat-label>
          <input matInput formControlName="name" (ngModelChange)="markDirty()" data-test-id="project-name-input" aria-required="true" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'project.form.description' | translate }}</mat-label>
          <textarea matInput formControlName="description" rows="4" data-test-id="project-description-input"></textarea>
        </mat-form-field>

        <div class="actions">
          <a mat-button routerLink="/projects" data-test-id="project-form-cancel">{{ 'common.cancel' | translate }}</a>
          <button mat-flat-button type="submit" [disabled]="form.invalid || saving" data-test-id="project-form-submit">
            @if (saving) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              {{ 'common.save' | translate }}
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
