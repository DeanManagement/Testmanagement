<div class="allure-viewer">
  <mat-toolbar class="allure-toolbar">
    <button mat-icon-button (click)="goBack()" data-test-id="allure-back-btn">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span>{{ 'testRun.allureReport.view' | translate }}</span>
    <span class="spacer"></span>
  </mat-toolbar>

  @if (iframeSrc) {
    <!-- PRD-018: sandbox WITHOUT allow-same-origin — the report runs in an opaque origin
         and cannot read localStorage/cookies or touch the parent app. -->
    <iframe
      [src]="iframeSrc"
      class="allure-iframe"
      sandbox="allow-scripts allow-popups"
      data-test-id="allure-report-iframe"
    ></iframe>
  }
</div>
