# PRD-019: unprivileged nginx image — non-root, listens on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Security headers (PRD-019), scoped to the static app shell. They must NOT apply to
    # /api/ — the backend controls its own headers there, and X-Frame-Options on the
    # proxied Allure view (PRD-018) would block its iframe. nginx add_header inheritance:
    # a location with its own add_header drops all inherited ones, hence the repetition.
    # CSP notes: Angular Material needs inline styles; Chart.js draws to canvas (data:/blob:).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/i18n/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # NOTE: never add proxy_cache to /api/ locations. Screenshot/step-image responses
    # are authorization-protected; a shared cache keyed by URI serves them to anyone
    # (see PRD-017). Browser-side caching via ETag/304 + Cache-Control: private suffices.
    location /api/ {
        proxy_pass http://testmanagement-backend:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}
