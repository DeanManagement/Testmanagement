services:
  testmanagement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testmanagement
      POSTGRES_USER: testmanagement
      # PRD-019 intended no default here. Note that PostgreSQL only applies this when the data
      # volume is first created: on an existing volume, changing it here changes nothing and the
      # app will simply fail to connect until the password is changed inside the database too.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testmanagement}
    # PRD-019: loopback only — the DB is reachable from other containers via the compose
    # network; the host mapping exists purely for local admin tooling.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_tm1:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmanagement"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One image: the Angular app is baked into the jar and served by Spring alongside the API, so
  # there is no separate frontend container and no nginx. Build context is the repository root.
  testmanagement:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://testmanagement-db:5432/testmanagement
      DB_USERNAME: testmanagement
      DB_PASSWORD: ${DB_PASSWORD:-testmanagement}
      # No default (PRD-019): a committed fallback secret would let anyone forge tokens.
      JWT_SECRET: ${JWT_SECRET:-}
      # Optional: seed the admin with a chosen password. If unset, a random password
      # is generated and printed ONCE to the backend log at first start.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The UI is now same-origin with the API, so CORS only matters for a separate dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Optional (PRD-010, PRD-012): needed to store issue-tracker tokens or OIDC client
      # secrets. Unset means those features refuse to store a secret rather than saving it
      # in plaintext.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      ISSUE_TRACKER_ENCRYPTION_KEY: ${ISSUE_TRACKER_ENCRYPTION_KEY:-}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-/login/callback}
    # 8012 kept as the published port so existing bookmarks and reverse-proxy rules still work;
    # in-container everything is Spring on 8089.
    ports:
      - "8012:8089"
    restart: unless-stopped
    depends_on:
      testmanagement-db:
        condition: service_healthy

volumes:
  pgdata_tm1:
