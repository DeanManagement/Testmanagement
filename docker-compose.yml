services:
  testmanagement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testmanagement
      POSTGRES_USER: testmanagement
      # No default (PRD-019): set DB_PASSWORD in .env (see .env.example).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — see .env.example}
    # PRD-019: loopback only — the DB is reachable from other containers via the compose
    # network; the host mapping exists purely for local admin tooling.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_tm1:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmanagement"]
      interval: 5s
      timeout: 5s
      retries: 5

  testmanagement-backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://testmanagement-db:5432/testmanagement
      DB_USERNAME: testmanagement
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — see .env.example}
      # No default (PRD-019): a committed fallback secret would let anyone forge tokens.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (e.g. openssl rand -base64 48) — see .env.example}
      # Optional: seed the admin with a chosen password. If unset, a random password
      # is generated and printed ONCE to the backend log at first start.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8012,https://testmanagement.klopsch.org}
      # Optional (PRD-010): only needed to connect a project to an issue tracker. Unset
      # means the integration refuses to store a token rather than saving it in plaintext.
      ISSUE_TRACKER_ENCRYPTION_KEY: ${ISSUE_TRACKER_ENCRYPTION_KEY:-}
    # PRD-019: fixed — Spring listens on 8089 in-container (the old 8089:8080 mapping
    # pointed at nothing; traffic only worked via the frontend proxy).
    ports:
      - "8089:8089"
    restart: unless-stopped
    depends_on:
      testmanagement-db:
        condition: service_healthy

  testmanagement-frontend:
    build: ./frontend
    # PRD-019: unprivileged nginx listens on 8080 (non-root cannot bind 80).
    ports:
      - "8012:8080"
    restart: unless-stopped
    depends_on:
      - testmanagement-backend

volumes:
  pgdata_tm1:
