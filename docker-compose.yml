services:
  testmanagement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testmanagement
      POSTGRES_USER: testmanagement
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testmanagement}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_tm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmanagement"]
      interval: 5s
      timeout: 5s
      retries: 5

  testmanagement-backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://testmanagement-db:5432/testmanagement
      DB_USERNAME: testmanagement
      DB_PASSWORD: ${DB_PASSWORD:-testmanagement}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8180/realms/testmanagement}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8180/realms/testmanagement/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8012}
    ports:
      - "8089:8080"
    depends_on:
      testmanagement-db:
        condition: service_healthy

  testmanagement-frontend:
    build: ./frontend
    ports:
      - "8012:80"
    depends_on:
      - testmanagement-backend

volumes:
  pgdata_tm:
