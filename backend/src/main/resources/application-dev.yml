spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testmanagement}
    username: ${DB_USERNAME:testmanagement}
    password: ${DB_PASSWORD:testmanagement}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: dev-secret-key-for-local-development-only
