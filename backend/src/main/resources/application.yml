spring:
  application:
    name: testmanagement
  ai:
    mcp:
      server:
        # PRD-025 §3.1. STATELESS streamable-HTTP: the API key is presented on every request, so
        # there is no session state worth keeping and no affinity needed if this ever runs with
        # more than one replica. SSE is deprecated in Spring AI 2.0 and is not offered.
        #
        # Chained off app.mcp.enabled rather than reading MCP_ENABLED again, so there is exactly
        # one switch. Setting only one of the two would leave the transport and the guardrails
        # disagreeing about whether the feature exists.
        enabled: ${app.mcp.enabled:false}
        protocol: STATELESS
        name: testmanagement
        version: 1.0.0
        instructions: >-
          Test management for a self-hosted instance. Every tool operates inside the single project
          your API key is scoped to; no tool takes a project id. Search before creating: duplicate
          test cases are the most common failure mode.
        streamable-http:
          mcp-endpoint: /api/mcp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/testmanagement}
    username: ${DB_USERNAME:testmanagement}
    # No default: a fat-JAR run outside docker-compose must not silently connect with a
    # well-known password. Dev profile overrides the datasource entirely.
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Batch lazy-loaded associations to avoid N+1 when mapping a page of entities.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/specific/{vendor}
    # PRD-019: fail loudly on a misconfigured migration path. db/specific/h2/ exists as a
    # placeholder so the {vendor} location resolves on H2 (dev/test) too.
    fail-on-missing-locations: true
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200
server:
  port: 8089
  # The jar now serves the Angular app as well as the API, so it does the gzipping that nginx
  # used to. Note text/javascript AND application/javascript: Tomcat labels .js as the former,
  # so a list carrying only the latter silently ships the bundle uncompressed — 116 kB instead
  # of 27 kB for main.js.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,text/plain
    min-response-size: 1024
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # X-Forwarded-For is appendable (nginx uses $proxy_add_x_forwarded_for), so a client
      # could smuggle a spoofed IP through the proxy and rotate past the per-IP login
      # throttle. X-Real-IP is a single value nginx always overwrites with the true peer.
      remote-ip-header: X-Real-IP

# PRD-019: only health (for container probes) and info (version) are exposed.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: testmanagement
    version: ${APP_VERSION:dev}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200, https://testmanagement.klopsch.org}
  jwt:
    secret: ${JWT_SECRET:}
    # 12 h (working day + margin, PRD-020). Tokens are also invalidated server-side on
    # logout and password change via the users.token_version claim check.
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  admin:
    email: ${ADMIN_EMAIL:admin@localhost.ch}
    # No default password (PRD-019). If unset, a random password is generated at first
    # start and printed ONCE to the log; the seeded admin must change it on first login.
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Administrator}
  search:
    # Postgres full-text (tsvector) search. Disable for non-Postgres deployments to use LIKE.
    full-text: ${SEARCH_FULL_TEXT:true}
  api-keys:
    # PRD-025 §3.2: keys without a project scope hold no role, so nothing can authorize them.
    # Enable only while re-creating them scoped.
    allow-legacy-global: ${API_KEYS_ALLOW_LEGACY_GLOBAL:false}
  mcp:
    # PRD-025: MCP server letting agents author test cases, suites and plans. Off by default —
    # it is a write surface for non-human callers, so it should be a deliberate decision.
    enabled: ${MCP_ENABLED:false}
    max-writes-per-minute: ${MCP_MAX_WRITES_PER_MINUTE:60}
    max-bulk-size: ${MCP_MAX_BULK_SIZE:50}
    max-steps-per-case: ${MCP_MAX_STEPS_PER_CASE:100}
    audit-retention-days: ${MCP_AUDIT_RETENTION_DAYS:90}
  mail:
    # Optional watcher email notifications. Off by default (air-gap safe).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@testmanagement.local}
  security:
    # AES key (base64, 16/24/32 bytes) for secrets the app stores and later replays:
    # issue-tracker API tokens, build-server API tokens (PRD-024) and OIDC client secrets.
    # Unset means those features refuse to store a secret rather than keeping it in plaintext.
    encryption-key: ${APP_ENCRYPTION_KEY:}
  sso:
    # Where the browser lands after an SSO login. Configuration only, never a request
    # parameter: the callback carries a session token (PRD-012 §3.4).
    frontend-callback-url: ${SSO_CALLBACK_URL:/login/callback}
    # SSRF guard for admin-supplied issuer URLs.
    allow-private-issuers: ${SSO_ALLOW_PRIVATE_ISSUERS:false}
  flaky:
    # Flakiness scoring (PRD-016). Conservative by design: under-reporting beats calling a
    # team's tests flaky on thin evidence.
    window: 20
    threshold: 0.3
    min-runs: 5
    # Labels are user-owned, and every change is audited, so this stays off unless asked for.
    auto-label: ${FLAKY_AUTO_LABEL:false}
    label: flaky
  issuetracker:
    # AES key (base64, 16/24/32 bytes) for stored tracker API tokens. Unset means the
    # integration refuses to store a token rather than keeping it in plaintext (PRD-010).
    encryption-key: ${ISSUE_TRACKER_ENCRYPTION_KEY:}
    # SSRF guard for self-hosted tracker base URLs.
    allow-private-targets: ${ISSUE_TRACKER_ALLOW_PRIVATE_TARGETS:false}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    # Status poll. No-ops entirely while no project has an active config.
    poll-interval-ms: 300000
    poll-batch-size: 50
    poll-min-age-ms: 240000
  buildserver:
    # PRD-024: on-demand pipeline triggering. SSRF guard for admin-supplied server URLs.
    allow-private-targets: ${BUILDSERVER_ALLOW_PRIVATE_TARGETS:false}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    # Status poll for non-terminal pipeline runs. No-ops entirely while no server is registered
    # or no run is in flight, so the short interval costs nothing on an idle instance.
    poll-interval-ms: 15000
    poll-batch-size: 20
    # A run still non-terminal after this long is marked TIMED_OUT and no longer polled.
    run-timeout-minutes: 120
    # Public URL of this instance, injected into triggered pipelines as TM_BASE_URL so the
    # workflow can call the report-back API without hardcoding it. Optional.
    public-base-url: ${PUBLIC_BASE_URL:}
  webhooks:
    # SSRF guard: only allow loopback/private targets if explicitly enabled.
    allow-private-targets: ${WEBHOOKS_ALLOW_PRIVATE_TARGETS:false}
    max-attempts: 3
    backoff-minutes: 1,5,30
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    retry-poll-ms: 30000
