spring:
  application:
    name: testmanagement
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testmanagement}
    username: ${DB_USERNAME:testmanagement}
    password: ${DB_PASSWORD:testmanagement}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-is-at-least-32-characters-long}
    expiration-ms: 86400000
