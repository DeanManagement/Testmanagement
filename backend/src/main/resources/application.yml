spring:
  application:
    name: testmanagement
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5431/testmanagement}
    username: ${DB_USERNAME:testmanagement}
    password: ${DB_PASSWORD:testmanagement}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8089
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200, https://testmanagement.klopsch.org}
  jwt:
    secret: ${JWT_SECRET:serijub32794zfv-wef08qweh_(ZG(IHBVdtg233edasb7vasdaasx}
    expiration-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@localhost.ch}
    password: ${ADMIN_PASSWORD:admin}
    display-name: ${ADMIN_DISPLAY_NAME:Administrator}
