spring:
  datasource:
    url: jdbc:h2:mem:testmanagement;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/specific/{vendor}
    fail-on-missing-locations: false
  h2:
    console:
      enabled: false
