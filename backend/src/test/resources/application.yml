spring:
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200
  ai:
    mcp:
      server:
        # This file SHADOWS src/main/resources/application.yml on the test classpath rather than
        # merging with it, so the MCP transport settings have to be repeated here — without them a
        # test that sets app.mcp.enabled=true gets the guardrails but no endpoint, and every
        # protocol assertion fails with a puzzling 404.
        enabled: ${app.mcp.enabled:false}
        protocol: STATELESS
        name: testmanagement
        version: 1.0.0
        streamable-http:
          mcp-endpoint: /api/mcp
app:
  search:
    full-text: false
  mcp:
    # Off unless a test turns it on, matching the production default.
    enabled: false
  security:
    encryption-key: dGVzdC1zaGFyZWQtc2VjcmV0LWtleS0zMi1ieXRlcyE=
  sso:
    frontend-callback-url: http://localhost:4200/login/callback
    allow-private-issuers: true
    require-https: false
  issuetracker:
    # Fixed 32-byte test key; the poller is pushed far out so it never fires during a test run.
    encryption-key: dGVzdC1pc3N1ZS10cmFja2VyLWtleS0zMi1ieXRlcyE=
    allow-private-targets: true
    require-https: false
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    poll-interval-ms: 3600000
    poll-min-age-ms: 0
  buildserver:
    # Stub build servers live on 127.0.0.1, and allow-private also skips DNS resolution so the
    # example.com fixtures work on runners without outbound DNS. The poller is pushed far out so
    # it never fires during a test run; strict URL rules are covered by BuildServerUrlValidatorTest.
    allow-private-targets: true
    require-https: false
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    poll-interval-ms: 3600000
  webhooks:
    allow-private-targets: true
    require-https: false
    max-attempts: 3
    backoff-minutes: 1,5,30
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    retry-poll-ms: 3600000
  jwt:
    secret: test-secret-key-for-unit-tests-at-least-32-chars
    expiration-ms: 86400000
  admin:
    email: admin@test.local
    password: testadmin
    display-name: Test Admin
