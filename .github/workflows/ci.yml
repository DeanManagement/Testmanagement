name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run tests
        working-directory: backend
        run: ./mvnw verify -B

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false
      - name: Build
        working-directory: frontend
        run: npx ng build

  docker:
    name: Docker builds + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t testmanagement-backend:ci backend
      - name: Build frontend image
        run: docker build -t testmanagement-frontend:ci frontend
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: testmanagement-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: testmanagement-frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create test .env
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-test-password
          JWT_SECRET=$(openssl rand -base64 48)
          ADMIN_PASSWORD=ci-admin-password-123
          EOF
      - name: Compose refuses to start without secrets (PRD-019)
        run: |
          if docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "compose accepted missing secrets — default-secret guard broken" >&2
            exit 1
          fi
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8089/actuator/health | grep -q UP; then exit 0; fi
            sleep 5
          done
          echo "backend never became healthy" >&2
          docker compose logs --tail 100 testmanagement-backend
          exit 1
      - name: Frontend serves the app
        run: curl -fsS http://localhost:8012/ | grep -qi '<app-root'
      - name: Login works end to end
        run: |
          status=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8012/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@localhost.ch","password":"ci-admin-password-123"}')
          [ "$status" = "200" ] || { echo "login returned $status"; cat /tmp/login.json; exit 1; }
      - name: Media auth not bypassed by any cache (PRD-017)
        run: bash scripts/smoke-media-auth.sh http://localhost:8012
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
