name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run tests
        working-directory: backend
        run: ./mvnw verify -B

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false
      - name: Build
        working-directory: frontend
        run: npx ng build
      # The production build is the only place these can be seen — an external font link or a
      # deferred stylesheet behind an inline handler both pass every unit test and then break
      # under the app's CSP at runtime. Shared with the Woodpecker pipeline.
      - name: Check the built bundle
        run: sh scripts/check-frontend-bundle.sh

  docker:
    name: Docker build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # One image: the root Dockerfile builds the Angular app and bakes it into the jar.
      - name: Build image
        run: docker build -t testmanagement:ci .
      # The whole architecture now rests on the SPA being inside the jar. If the frontend stage
      # silently produced nothing, every check below still passes and the container serves 404s.
      - name: The image contains the built SPA
        run: |
          # Inspect the jar on the runner: the JRE base image has neither unzip nor jar.
          id=$(docker create testmanagement:ci)
          docker cp "$id:/app/app.jar" /tmp/app.jar
          docker rm "$id" > /dev/null
          unzip -l /tmp/app.jar | grep -q 'BOOT-INF/classes/static/index.html' \
            || { echo "app.jar has no bundled SPA" >&2; exit 1; }
      # The tag is v-prefixed. trivy-action tagged releases WITHOUT the `v` up to 0.35.0 and
      # switched at 0.36.0, so `@0.36.0` looks right, matches the old convention, and fails at
      # job setup with "unable to find version 0.36.0".
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: testmanagement:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Create test .env
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-test-password
          JWT_SECRET=$(openssl rand -base64 48)
          ADMIN_PASSWORD=ci-admin-password-123
          EOF
      - name: Compose refuses to start without secrets (PRD-019)
        run: |
          if docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "compose accepted missing secrets — default-secret guard broken" >&2
            exit 1
          fi
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8012/actuator/health | grep -q UP; then exit 0; fi
            sleep 5
          done
          echo "app never became healthy" >&2
          docker compose logs --tail 100 testmanagement
          exit 1
      # The jar serves the SPA now; this also proves the index.html fallback is wired.
      - name: App shell is served
        run: curl -fsS http://localhost:8012/ | grep -qi '<app-root'
      - name: Deep link falls back to the shell
        run: curl -fsS http://localhost:8012/dashboard | grep -qi '<app-root'
      - name: A mistyped API path 404s rather than returning the shell
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8012/api/does-not-exist)
          [ "$status" = "401" ] || [ "$status" = "403" ] || [ "$status" = "404" ] \
            || { echo "expected an error status, got $status"; exit 1; }
      - name: Login works end to end
        run: |
          status=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8012/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@localhost.ch","password":"ci-admin-password-123"}')
          [ "$status" = "200" ] || { echo "login returned $status"; cat /tmp/login.json; exit 1; }
      - name: Media auth not bypassed by any cache (PRD-017)
        run: bash scripts/smoke-media-auth.sh http://localhost:8012
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
