name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Full test run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw verify -B
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx ng test --watch=false && npx ng build
        working-directory: frontend
      - name: Check the built bundle
        run: bash scripts/check-frontend-bundle.sh

  publish:
    name: Build + push images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/testmanagement
          docker build --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            -t $IMG:${{ steps.version.outputs.version }} -t $IMG:latest .
      # Verify before pushing: a tagged release is the worst place to discover that the frontend
      # stage produced nothing and the jar serves 404s.
      - name: The image contains the built SPA
        run: |
          id=$(docker create ghcr.io/${{ github.repository_owner }}/testmanagement:latest)
          docker cp "$id:/app/app.jar" /tmp/app.jar
          docker rm "$id" > /dev/null
          unzip -l /tmp/app.jar | grep -q 'BOOT-INF/classes/static/index.html' \
            || { echo "app.jar has no bundled SPA — refusing to publish" >&2; exit 1; }
      - name: Push image
        run: docker push --all-tags ghcr.io/${{ github.repository_owner }}/testmanagement
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
